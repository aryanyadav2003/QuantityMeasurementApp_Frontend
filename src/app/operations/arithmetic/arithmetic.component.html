<app-navbar></app-navbar>

<div style="max-width:700px; margin:32px auto; padding:0 16px;">

  <a routerLink="/dashboard" style="color:#1976d2; text-decoration:none; font-size:14px;">← Back to Dashboard</a>

  <h2 style="margin:16px 0 4px;">➕ Arithmetic Operations</h2>
  <p style="color:#666; margin:0 0 24px; font-size:14px;">Add, subtract or divide two quantities. Works without login.</p>

  <!-- Error -->
  <div *ngIf="error" style="background:#ffebee; color:#c62828; padding:12px; border-radius:4px; margin-bottom:16px;">
    {{ error }}
  </div>

  <div style="background:white; padding:28px; border-radius:8px; border:1px solid #e0e0e0; box-shadow:0 1px 4px rgba(0,0,0,0.08);">

    <!-- Operation selector -->
    <div style="margin-bottom:20px;">
      <label style="display:block; font-weight:600; margin-bottom:10px;">Operation</label>
      <div style="display:flex; gap:8px;">
        <button *ngFor="let op of operations" (click)="selectedOperation = op; result = null"
          [style.background]="selectedOperation === op ? '#388e3c' : '#f5f5f5'"
          [style.color]="selectedOperation === op ? 'white' : '#333'"
          style="padding:8px 20px; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-size:14px; font-weight:500;">
          {{ op }}
        </button>
      </div>
    </div>

    <!-- Measurement type selector -->
    <div style="margin-bottom:20px;">
      <label style="display:block; font-weight:600; margin-bottom:10px;">Measurement Type</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button *ngFor="let t of types" (click)="onTypeChange(t)"
          [style.background]="measurementType === t ? '#1976d2' : '#f5f5f5'"
          [style.color]="measurementType === t ? 'white' : '#333'"
          style="padding:8px 16px; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-size:14px;">
          {{ t }}
        </button>
      </div>
    </div>

    <!-- Quantity 1 -->
    <fieldset style="border:1px solid #e0e0e0; border-radius:6px; padding:16px; margin-bottom:14px;">
      <legend style="font-weight:600; padding:0 8px; color:#1976d2;">Quantity 1</legend>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <div style="flex:1; min-width:110px;">
          <label style="display:block; font-size:13px; margin-bottom:4px;">Value</label>
          <input type="number" [(ngModel)]="q1.value"
            style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;" />
        </div>
        <div style="flex:1; min-width:110px;">
          <label style="display:block; font-size:13px; margin-bottom:4px;">Unit</label>
          <select [(ngModel)]="q1.unit"
            style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
            <option *ngFor="let u of units" [value]="u">{{ u }}</option>
          </select>
        </div>
      </div>
    </fieldset>

    <!-- Quantity 2 -->
    <fieldset style="border:1px solid #e0e0e0; border-radius:6px; padding:16px; margin-bottom:14px;">
      <legend style="font-weight:600; padding:0 8px; color:#1976d2;">Quantity 2</legend>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <div style="flex:1; min-width:110px;">
          <label style="display:block; font-size:13px; margin-bottom:4px;">Value</label>
          <input type="number" [(ngModel)]="q2.value"
            style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;" />
        </div>
        <div style="flex:1; min-width:110px;">
          <label style="display:block; font-size:13px; margin-bottom:4px;">Unit</label>
          <select [(ngModel)]="q2.unit"
            style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
            <option *ngFor="let u of units" [value]="u">{{ u }}</option>
          </select>
        </div>
      </div>
    </fieldset>

    <!-- Target unit (not shown for DIVIDE) -->
    <div *ngIf="showTargetUnit" style="margin-bottom:20px;">
      <label style="display:block; font-size:13px; font-weight:500; margin-bottom:4px;">Result Unit</label>
      <select [(ngModel)]="targetUnit"
        style="padding:8px; border:1px solid #ccc; border-radius:4px; min-width:160px;">
        <option *ngFor="let u of units" [value]="u">{{ u }}</option>
      </select>
    </div>

    <!-- Calculate button -->
    <button (click)="calculate()" [disabled]="loading"
      style="padding:12px 32px; background:#388e3c; color:white; border:none; border-radius:4px; font-size:15px; cursor:pointer; margin-bottom:20px;">
      {{ loading ? 'Calculating...' : 'Calculate' }}
    </button>

    <!-- Result -->
    <div *ngIf="result" style="padding:16px; background:#e8f5e9; border:1px solid #a5d6a7; border-radius:6px;">
      <strong style="font-size:16px; color:#2e7d32;">✅ Result</strong>
      <p style="margin:8px 0 0; font-size:15px;">
        <ng-container *ngIf="selectedOperation !== 'DIVIDE'">
          <strong>{{ result.resultValue }} {{ targetUnit }}</strong>
        </ng-container>
        <ng-container *ngIf="selectedOperation === 'DIVIDE'">
          Ratio = <strong>{{ result.scalarResult }}</strong>
        </ng-container>
      </p>
      <p *ngIf="result.message" style="margin:4px 0 0; font-size:13px; color:#555;">{{ result.message }}</p>
    </div>

  </div>
</div>
