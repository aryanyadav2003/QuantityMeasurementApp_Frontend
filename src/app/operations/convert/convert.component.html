<app-navbar></app-navbar>

<div style="max-width:700px; margin:32px auto; padding:0 16px;">

  <a routerLink="/dashboard" style="color:#1976d2; text-decoration:none; font-size:14px;">← Back to Dashboard</a>

  <h2 style="margin:16px 0 4px;">🔄 Convert Units</h2>
  <p style="color:#666; margin:0 0 24px; font-size:14px;">Convert a value from one unit to another. Works without login.</p>

  <!-- Error -->
  <div *ngIf="error" style="background:#ffebee; color:#c62828; padding:12px; border-radius:4px; margin-bottom:16px;">
    {{ error }}
  </div>

  <div style="background:white; padding:28px; border-radius:8px; border:1px solid #e0e0e0; box-shadow:0 1px 4px rgba(0,0,0,0.08);">

    <!-- Measurement type -->
    <div style="margin-bottom:20px;">
      <label style="display:block; font-weight:600; margin-bottom:10px;">Measurement Type</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button *ngFor="let t of types" (click)="onTypeChange(t)"
          [style.background]="measurementType === t ? '#1976d2' : '#f5f5f5'"
          [style.color]="measurementType === t ? 'white' : '#333'"
          style="padding:8px 16px; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-size:14px;">
          {{ t }}
        </button>
      </div>
    </div>

    <!-- Input quantity -->
    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px;">
      <div style="flex:1; min-width:120px;">
        <label style="display:block; font-size:13px; font-weight:500; margin-bottom:4px;">Value</label>
        <input type="number" [(ngModel)]="q.value"
          style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;" />
      </div>
      <div style="flex:1; min-width:120px;">
        <label style="display:block; font-size:13px; font-weight:500; margin-bottom:4px;">From Unit</label>
        <select [(ngModel)]="q.unit"
          style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
          <option *ngFor="let u of units" [value]="u">{{ u }}</option>
        </select>
      </div>
      <div style="flex:1; min-width:120px;">
        <label style="display:block; font-size:13px; font-weight:500; margin-bottom:4px;">To Unit</label>
        <select [(ngModel)]="targetUnit"
          style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
          <option *ngFor="let u of units" [value]="u">{{ u }}</option>
        </select>
      </div>
    </div>

    <!-- Convert button -->
    <button (click)="convert()" [disabled]="loading"
      style="padding:12px 32px; background:#1976d2; color:white; border:none; border-radius:4px; font-size:15px; cursor:pointer; margin-bottom:20px;">
      {{ loading ? 'Converting...' : 'Convert' }}
    </button>

    <!-- Result -->
    <div *ngIf="result" style="padding:16px; background:#e3f2fd; border:1px solid #90caf9; border-radius:6px;">
      <strong style="font-size:16px; color:#1565c0;">✅ Result</strong>
      <p style="margin:8px 0 0; font-size:15px;">
        {{ q.value }} {{ q.unit }} =
        <strong>{{ result.resultValue }} {{ targetUnit }}</strong>
      </p>
      <p *ngIf="result.message" style="margin:4px 0 0; font-size:13px; color:#555;">{{ result.message }}</p>
    </div>

  </div>
</div>
